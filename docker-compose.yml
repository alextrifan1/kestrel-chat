services:
  postgres:
    image: postgres:17-alpine
    container_name: kestrel-postgres
    environment:
      POSTGRES_DB: kestrel
      POSTGRES_USER: ${POSTGRES_USER:-kestrel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kestrel}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kestrel} -d kestrel"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: